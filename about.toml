# cargo-about config for generating THIRD-PARTY-NOTICES.md.
#   cargo about generate about.hbs -o THIRD-PARTY-NOTICES.md
# Only crates actually linked into the shipped Windows binary matter, so build/dev
# dependencies are ignored and the target is pinned. `accepted` lists every SPDX license
# present in that graph; for multi-licensed crates cargo-about picks the first accepted
# (MIT/Apache preferred over copyleft options where offered).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    # webpki-roots ships Mozilla's CA root DATA under the Community Data License
    # Agreement (permissive variant). It is a permissive, non-copyleft licence, and the
    # crate is already linked into the shipped binary via `ureq` (the update check) - so
    # refusing it here does not remove it, it only stops it being DOCUMENTED. Without this
    # entry `cargo about generate` fails outright and the notices silently go stale.
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
