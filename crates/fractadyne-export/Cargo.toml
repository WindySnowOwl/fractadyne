[package]
name = "fractadyne-export"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tiled high-res export, PNG/OpenEXR/JPEG/AVIF/GIF encoders (planned — DESIGN.md §12)."

[dependencies]
png = "0.17"
exr = "1"
jpeg-encoder = "0.7"
zune-jpeg = "0.5"
zune-core = "0.5"
gif = "0.14"
color_quant = "1.1"
# AVIF (rav1e), with its assembly: building it needs NASM 2.14 or newer, on PATH or named by the
# NASM environment variable (scripts/setup.ps1 and linux-build.sh --deps install it).
ravif = { version = "0.13", default-features = false, features = ["threading", "asm"] }
thiserror.workspace = true

[lints]
workspace = true
