[package]
name = "fractadyne-export"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tiled high-res export, PNG/OpenEXR/JPEG/AVIF/GIF encoders (planned — DESIGN.md §12)."

[dependencies]
png = "0.17"
exr = "1"
jpeg-encoder = "0.7"
zune-jpeg = "0.5"
zune-core = "0.5"
gif = "0.14"
color_quant = "1.1"
# AVIF (rav1e): without its assembly, which needs nasm to build.
ravif = { version = "0.13", default-features = false, features = ["threading"] }
thiserror.workspace = true

[lints]
workspace = true
