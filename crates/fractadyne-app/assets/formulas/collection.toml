# ---- Blends and hybrids ----

[[formula]]
name = "Cubic with a parameter"
category = "Blends and hybrids"
about = "z³ − p₁z + c: a slice of the cubic family, its two critical points pulled apart by p₁."
source = "z = z^3 - p1*z + c"
params = [["0.5", "0"]]
[formula.view]
center = ["0", "0"]
zoom = "1.3"
iterations = 300

[[formula]]
name = "Hybrid square"
category = "Blends and hybrids"
about = "z² plus a share of its conjugate: t = z², z = t + p₁·t̄ + c."
source = "t = sqr(z)\nz = t + p1*conj(t) + c"
params = [["0.25", "0"]]
[formula.view]
center = ["-0.5", "0"]
zoom = "1"
iterations = 300

[[formula]]
name = "Mandelbrot–Burning Ship blend"
category = "Blends and hybrids"
about = "Halfway between the two: (1 − p₁)z² + p₁·(|x| + i|y|)² + c."
source = "z = (1 - p1)*z^2 + p1*abs(z)^2 + c"
params = [["0.5", "0"]]
[formula.view]
center = ["0", "0"]
zoom = "0.7"
iterations = 300

[[formula]]
name = "Mandelbrot–Tricorn blend"
category = "Blends and hybrids"
about = "(1 − p₁)z² + p₁·z̄² + c: the Mandelbrot set losing its imaginary stretch."
