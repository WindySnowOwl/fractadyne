[formula.view]
center = ["-0.5", "0"]
zoom = "1"
iterations = 300

[[formula]]
name = "Mandelbrot then cubic"
category = "Blends and hybrids"
about = "A Mandelbrot step, then a cubic one: w³ + c with w = z² + c."
