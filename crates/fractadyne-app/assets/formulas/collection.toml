# The formula collection that comes with Fractadyne: Fractal > Custom formula > Examples, and the
# Collection tab of Fractal > Formula library. Written for Fractadyne from the mathematics; every
# entry has a starting view, and a test renders each one there and checks the picture is there.
#
# zoom is the magnification (1 = the home view, 4 units tall); julia, when present, shows the
# Julia set for that constant.

format = "fractadyne-formulas"
version = 1

# ---- Powers and folds ----

[[formula]]
name = "Multibrot 6"
category = "Powers and folds"
about = "z⁶ + c: the Mandelbrot construction at power 6, with fivefold symmetry."
source = "z = z^6 + c"
[formula.view]
center = ["0", "0"]
zoom = "1.6"
iterations = 300

[[formula]]
name = "Multibrot 8"
category = "Powers and folds"
about = "z⁸ + c: sevenfold symmetry, the bulbs thinning towards a circle."
source = "z = z^8 + c"
[formula.view]
center = ["0", "0"]
zoom = "1.6"
iterations = 300

[[formula]]
name = "Cubic Burning Ship"
category = "Powers and folds"
about = "The Burning Ship at power 3: both parts made positive, then cubed."
source = "z = abs(z)^3 + c"
[formula.view]
center = ["0", "0"]
zoom = "1.4"
iterations = 300

[[formula]]
name = "Quartic Burning Ship"
category = "Powers and folds"
