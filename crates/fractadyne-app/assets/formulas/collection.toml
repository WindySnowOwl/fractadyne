params = [["0.5", "0"]]
[formula.view]
center = ["-0.5", "0"]
zoom = "1"
iterations = 300

[[formula]]
name = "Mandelbrot then Burning Ship"
category = "Blends and hybrids"
about = "Each step a Mandelbrot step, then a Burning Ship one: (|Re w| + i|Im w|)² + c with w = z² + c."
source = "w = z^2 + c\nz = abs(w)^2 + c"
[formula.view]
center = ["-0.5", "0"]
zoom = "1"
