[package]
name = "fractadyne-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fractadyne desktop binary: window, egui shell, input, glue."

[[bin]]
name = "fractadyne"
path = "src/main.rs"

[dependencies]
fractadyne-core.workspace = true
fractadyne-gpu.workspace = true
fractadyne-color.workspace = true
fractadyne-state.workspace = true
fractadyne-export.workspace = true
eframe.workspace = true
egui.workspace = true
log.workspace = true
env_logger.workspace = true
directories.workspace = true
rfd.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
# Update check: a single blocking HTTPS GET to the GitHub Releases API (rustls, bundled roots).
ureq = "2"
serde_json = "1"

[lints]
workspace = true

# Linux-only: statvfs for the free-disk diagnostics (crash reports + render size estimates).
# The Windows arms use raw Win32 FFI; glibc is linked on Linux regardless, this just adds the
# bindings.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
