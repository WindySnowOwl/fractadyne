[package]
name = "fractadyne-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fractadyne desktop binary: window, egui shell, input, glue."

[[bin]]
name = "fractadyne"
path = "src/main.rs"

[dependencies]
fractadyne-core.workspace = true
fractadyne-text.workspace = true
fractadyne-gpu.workspace = true
fractadyne-color.workspace = true
fractadyne-state.workspace = true
fractadyne-export.workspace = true
fractadyne-farm.workspace = true
eframe.workspace = true
egui.workspace = true
log.workspace = true
env_logger.workspace = true
directories.workspace = true
rfd.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
# Update check: a single blocking HTTPS GET to the GitHub Releases API (rustls, bundled roots).
ureq = "2"
serde_json = "1"
# SHA-256 of each frame a render-farm run writes (`--farm-child`), for the controller to verify the
# file it receives. Already linked — rustls, the update check's TLS above, is built on it — so this
# adds no third-party code; the render farm's channel (design/remote-rendering.md) will use it too.
ring = { version = "0.17", default-features = false }
# The formula editor's textbook mode reads the math font's OpenType MATH table (layout constants,
# stretchy-glyph variants). Already in the tree under egui's font stack (ab_glyph), so this adds no
# third-party code; its default `opentype-layout` feature is what exposes the MATH table.
ttf-parser = "0.25"

# Compile in the DX12 backend so `--gputest` can grade the HLSL/FXC-DXC shader compiler too.
# eframe asks wgpu for only ["metal", "webgpu"], so on Windows this binary could reach Vulkan and
# GL but NEVER DX12 — which is why the 2026-08-13 folded-EFT investigation could not get a DX12
# data point at all (it looked like "no adapter" on a card that plainly has one). Enabling the
# feature adds the backend to the build; it deliberately does NOT change which backend the app
# runs on — see the pinned `backends:` in main.rs for why that pin is load-bearing.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "24", default-features = false, features = ["dx12"] }

[lints]
workspace = true

# Linux-only: statvfs for the free-disk diagnostics (crash reports + render size estimates).
# The Windows arms use raw Win32 FFI; glibc is linked on Linux regardless, this just adds the
# bindings.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Font-coverage guard only (`icons::coverage`; it also uses `ttf-parser`, a normal dependency now).
# Already in the tree as epaint's own dependency, so this pins no new third-party code into the
# binary - dev-dependencies are not linked into a release build.
epaint_default_fonts = "0.31"
