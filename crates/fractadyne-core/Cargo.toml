[package]
name = "fractadyne-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core numerics and viewport math for Fractadyne (no GPU/UI deps)."

[dependencies]
astro-float.workspace = true
rug = { workspace = true, optional = true }
gmp-mpfr-sys = { workspace = true, optional = true }

[features]
default = []
# The MPFR/GMP reference-orbit backend. OFF unless asked for -- see the workspace manifest for why
# it can never be the default, and `src/backend.rs` for the bit-identity contract it must meet.
# Build/test it with the GNU toolchain: `cargo +stable-x86_64-pc-windows-gnu test -p fractadyne-core
# --features rug` (on Windows this needs MSYS2 with diffutils, m4, make and mingw-w64-x86_64-gcc).
rug = ["dep:rug", "dep:gmp-mpfr-sys"]

[lints]
workspace = true
