name: Bug report
description: Something rendered wrong, crashed, hung, or otherwise misbehaved.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **do not** use this form for security
        vulnerabilities (e.g. a crafted file that crashes the parser) — follow
        [SECURITY.md](https://github.com/WindySnowOwl/fractadyne/blob/main/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: From Help → About or the title bar (e.g. `v0.1.11 (build 1234)`).
      placeholder: v0.1.11
    validations:
      required: true
  - type: input
    id: os-gpu
    attributes:
      label: OS and GPU
      description: e.g. "Windows 11, NVIDIA RTX 3080". The GPU matters for render bugs.
      placeholder: Windows 11 / RTX 3080
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed vs. what you expected. Screenshots help for render issues.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Exact steps, ideally from a fresh launch. If it involves a specific
        location, paste a **Share location…** (`.fdn`) blob or attach the file /
        exported image that reproduces it.
      placeholder: |
        1. Open …
        2. Zoom to …
        3. …
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Console output (run from a terminal to see `[perf]` / error logs), frequency, workarounds.
    validations:
      required: false
