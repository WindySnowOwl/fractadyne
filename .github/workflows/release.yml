name: Release

# Build and publish the Windows + Linux binaries. Tag a release (e.g. `git tag v0.1.0 && git
# push --tags`) to build + attach both archives to a GitHub Release; or run manually
# (workflow_dispatch) to produce downloadable test artifacts without publishing.
#
# Tag runs are a four-job fan-out/fan-in: create-release makes a DRAFT, windows and linux build
# and upload into it in parallel, publish undrafts it once both have succeeded. Manual runs skip
# create-release and publish (both are tag-gated) and the two build jobs upload workflow
# artifacts instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Name for a manual test build (artifact only; not published)"
        required: false
        default: "dev"

permissions:
  contents: write # needed to create the release + upload assets

jobs:
  # Create the release FIRST, as a draft, so neither build job races the other to call
  # `gh release create`. Previously only the windows job created it and linux retried the upload
  # for three minutes waiting for it to appear — linux builds faster, so a slow windows build
  # would silently drop the Linux asset from the release. Now both jobs upload into a release
  # that already exists, and `publish` undrafts it only after BOTH succeed: a failed build leaves
  # an unpublished draft (invisible to the update checker) rather than a release missing a
  # platform.
  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Checked out only for `.github/release-notes-preamble.md` — the "which download?" guide the
      # next step prepends to the generated notes. Nothing else here reads the tree, and `gh` would
      # normally infer the repo from the git remote, so GH_REPO still supplies it.
      - uses: actions/checkout@v7

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          # Idempotent: a re-run of a partially-failed workflow must not fail here, and must not
          # regenerate notes over a release that may already have been edited by hand.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — leaving it as-is"
            exit 0
          fi
          # Track selection by tag shape: a pre-release suffix (v0.3.0-beta.1 / -rc.1 / -alpha.1)
          # publishes as a GitHub *pre-release* (the "beta" track); a plain vX.Y.Z tag publishes as
          # a stable release and is marked "latest" (the "release" track) when it is undrafted. An
          # update checker can then query /releases/latest for stable, or the newest of /releases
          # (incl. pre-releases) for beta.
          set -- "$tag" --draft --title "Fractadyne $tag" --generate-notes
          case "$tag" in
            *-*) set -- "$@" --prerelease ;;
          esac
          gh release create "$@"

      # The assets are three zips and a tarball with near-identical names, and which one a visitor
      # wants — especially whether they want `-accelerated.zip` — is not readable from the file
      # list. Prepend a short guide to the generated notes so the answer is on the page they land
      # on, not only in a README inside the download.
      #
      # A SEPARATE step, and idempotent, deliberately: it edits a release that already exists, so
      # if this fails the release is still there with its generated notes (degraded, not blocked),
      # and a re-run repairs it. The marker is what makes the re-run safe — without it, every run
      # would stack another copy of the guide on top.
      - name: Prepend the download guide to the notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          marker="## Which download?"
          body=$(gh release view "$tag" --json body -q .body)
          case "$body" in
            *"$marker"*)
              echo "download guide already present — leaving the notes alone"
              exit 0
              ;;
          esac
          { cat .github/release-notes-preamble.md; printf '\n'; printf '%s\n' "$body"; } > notes.md
          gh release edit "$tag" --notes-file notes.md
          echo "prepended $(wc -l < .github/release-notes-preamble.md) lines of download guide"

  windows:
    name: Windows x64 binary
    needs: create-release
    # Tag runs wait for the draft; manual (workflow_dispatch) runs skip create-release entirely
    # and still build an artifact, so a *skipped* dependency must not skip this job.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use stable Rust
        run: rustup default stable

      # The standard release profile (matches local builds: no debuginfo, LTO off).
      # Runners aren't page-file constrained, but keeping the same profile avoids
      # shipping an untested optimization config.
      - name: Build release binary
        run: cargo build --release --bin fractadyne

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "main" -or [string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.event.inputs.tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "dev" }
          $dir = "fractadyne-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # The binary (self-contained: shaders + window icon are embedded).
          Copy-Item target/release/fractadyne.exe -Destination $dir/
          # Docs + licenses (incl. third-party dependency notices).
          Copy-Item README.md, CHANGELOG.md, TOURS.md, DIAGNOSTICS.md, THIRD-PARTY-NOTICES.md, LICENSE-APACHE, LICENSE-MIT -Destination $dir/
          # Example guided-tour scripts (play in-app, or render headless with --render-tour).
          New-Item -ItemType Directory -Force -Path "$dir/tours" | Out-Null
          Copy-Item tours/*.toml -Destination "$dir/tours/"
          # Example scripting / profiling-region files.
          New-Item -ItemType Directory -Force -Path "$dir/scripts" | Out-Null
          Copy-Item scripts/*.example.toml -Destination "$dir/scripts/"
          Copy-Item scripts/deep-sample.fdn -Destination "$dir/scripts/"
          # Validation data so `--selftest` / `--bench-matrix` work from the extracted install:
          # `anchored()` walks up from the binary and finds this `validation/` tree beside it.
          # (The goldens are blessed on the dev RTX 3080; an exact match confirms the GPU produces
          # identical output, so small deltas on other hardware are expected FP32 variance.)
          New-Item -ItemType Directory -Force -Path "$dir/validation/golden" | Out-Null
          Copy-Item validation/golden/*.png -Destination "$dir/validation/golden/"
          # BLESSED-GPU.txt records which card produced these images. Without it a tester's
          # self-test falls back to the strict tolerance and reports expected cross-vendor
          # differences as failures - which is precisely the confusion the tolerance exists to
          # prevent. (Falling back to strict is the SAFE direction, so a missing file degrades
          # gracefully; it just wastes the feature.)
          Copy-Item validation/golden/BLESSED-GPU.txt -Destination "$dir/validation/golden/" -ErrorAction SilentlyContinue
          Copy-Item validation/catalog.toml -Destination "$dir/validation/"
          New-Item -ItemType Directory -Force -Path "$dir/benchmarks" | Out-Null
          Copy-Item benchmarks/bench-matrix-baseline.json -Destination "$dir/benchmarks/"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force
          $hash = (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $dir.zip" | Out-File -FilePath "$dir.zip.sha256" -Encoding ascii
          "ASSET=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      # Uploads into the draft `create-release` already made. No retry loop: the release is
      # guaranteed to exist, so a failure here is a real failure and should fail the job.
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release upload $tag $env:ASSET "$env:ASSET.sha256" --clobber

      - name: Upload artifact (manual/test runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: fractadyne-windows-x64
          path: |
            *.zip
            *.zip.sha256

  # Linux x64 binary. Deliberately ubuntu-22.04, not `latest`: the binary links the build
  # machine's glibc, so 22.04 (glibc 2.35) runs on Debian 12, Fedora 38+, Arch and 24.04, while
  # a 24.04 build (2.39) refuses to start on a large share of the likely audience. System deps
  # mirror ci.yml's build-linux job (winit/eframe need X11+Wayland+xkbcommon; rfd needs GTK3).
  linux:
    name: Linux x64 binary
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Use stable Rust
        run: rustup default stable

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Build release binary
        run: cargo build --release --bin fractadyne

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          if [ "$tag" = "main" ] || [ -z "$tag" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          [ -z "$tag" ] && tag="dev"
          dir="fractadyne-$tag-linux-x64"
          mkdir -p "$dir/tours" "$dir/scripts" "$dir/validation/golden" "$dir/benchmarks"
          cp target/release/fractadyne "$dir/"
          cp README.md CHANGELOG.md TOURS.md DIAGNOSTICS.md THIRD-PARTY-NOTICES.md LICENSE-APACHE LICENSE-MIT "$dir/"
          cp tours/*.toml "$dir/tours/"
          cp scripts/*.example.toml "$dir/scripts/"
          cp scripts/deep-sample.fdn "$dir/scripts/"
          # Validation data so `--selftest` / `--bench-matrix` work from the extracted install:
          # `anchored()` walks up from the binary and finds this `validation/` tree beside it.
          # (Goldens are blessed on the dev RTX 3080 — an exact match confirms identical GPU
          # output; small deltas on other hardware are expected FP32 variance.)
          cp validation/golden/*.png "$dir/validation/golden/"
          # BLESSED-GPU.txt records which card produced these images. Without it a tester's
          # self-test falls back to the STRICT tolerance and reports expected cross-vendor
          # differences as failures — precisely the confusion the tolerance exists to prevent.
          # (The windows job has always shipped this; the linux job did not, so every Linux
          # tester on a non-3080 card saw false failures. Falling back to strict is the SAFE
          # direction, so its absence degraded gracefully — it just wasted the feature.)
          cp validation/golden/BLESSED-GPU.txt "$dir/validation/golden/" 2>/dev/null || true
          cp validation/catalog.toml "$dir/validation/"
          cp benchmarks/bench-matrix-baseline.json "$dir/benchmarks/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      # Uploads into the draft `create-release` already made. The old version of this step raced
      # the windows job for the release's existence and retried 6×30s; that window happened to be
      # enough on v0.2.40-beta.104, but linux builds faster than windows, so a slow windows build
      # would have exhausted it and dropped this asset.
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release upload "$tag" "$ASSET" "$ASSET.sha256" --clobber

      - name: Upload artifact (manual/test runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: fractadyne-linux-x64
          path: |
            *.tar.gz
            *.tar.gz.sha256

  # OPTIONAL accelerated Windows build: same program, deep-zoom reference orbits computed with
  # MPFR/GMP instead of astro-float (2.5-6.4x faster at that step, byte-identical output).
  #
  # It is a separate artifact for two reasons that are not going away: MPFR does not build on the
  # MSVC toolchain the standard binary uses, and rug/gmp-mpfr-sys/GMP/MPFR are LGPL-3.0+ against
  # this project's MIT OR Apache-2.0. `scripts/build-accelerated.ps1` owns the whole thing —
  # including linking the libraries DYNAMICALLY, which is what keeps the obligations to notices
  # (LGPLv3 4(d)(1)) rather than to shipping the app in relinkable form with every release
  # (4(d)(0)). Read that script's header before changing anything here.
  windows-accelerated:
    name: Windows x64 (accelerated, MPFR)
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use the GNU Rust toolchain
        # MPFR needs the GNU target; the standard Windows job uses MSVC and cannot build this.
        run: rustup toolchain install stable-x86_64-pc-windows-gnu

      - name: MSYS2 packages
        shell: pwsh
        run: |
          # The runner image ships MSYS2 at C:\msys64. Fail loudly rather than silently skipping
          # the artifact: a release whose Help link 404s is worse than a release that stopped.
          if (-not (Test-Path "C:\msys64\usr\bin\pacman.exe")) {
            Write-Host "::error::MSYS2 not found at C:\msys64 on this runner image."
            exit 1
          }
          # gcc links the GNU-target binary; pkgconf lets gmp-mpfr-sys FIND the system libraries;
          # gmp/mpfr are the libraries whose DLLs the package ships. m4/make are only needed if
          # gmp-mpfr-sys ever falls back to building from source, and are cheap insurance.
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed --noprogressbar diffutils m4 make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-gmp mingw-w64-x86_64-mpfr"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build and package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "main" -or [string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.event.inputs.tag }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "dev" }
          # The in-app "Faster deep zoom" link builds its URL from the RUNNING version:
          #   fractadyne-v<cargo version>-windows-x64-accelerated.zip
          # so if the git tag and the Cargo version ever diverge, that link 404s for every user of
          # this release. The app side is pinned by a unit test; this is the other half.
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -like "v*" -and $tag -ne "v$ver") {
            Write-Host "::error::tag '$tag' does not match Cargo version 'v$ver' - the in-app download link would 404."
            exit 1
          }
          # The script builds, then VERIFIES the packaged binary on a PATH stripped of MSYS2 -
          # i.e. under a user's conditions, not the build machine's. Do not pass -SkipVerify.
          .\scripts\build-accelerated.ps1 -Tag $tag -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $zip = Get-ChildItem dist -Filter "*-accelerated.zip" | Select-Object -First 1
          if (-not $zip) { Write-Host "::error::no accelerated zip produced"; exit 1 }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -FilePath "$($zip.FullName).sha256" -Encoding ascii
          "ASSET=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release upload $tag $env:ASSET "$env:ASSET.sha256" --clobber

      - name: Upload artifact (manual/test runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: fractadyne-windows-x64-accelerated
          path: |
            dist/*.zip
            dist/*.zip.sha256

  # Undraft only after EVERY build has uploaded. Default `needs` semantics skip this job if any of
  # them failed, which leaves the draft in place with whatever assets made it — inspectable and
  # deletable, and never visible to `--check-updates` as a release missing a platform.
  #
  # OPTIONAL accelerated LINUX build. Same program, MPFR/GMP reference orbits, byte-identical
  # output — the Linux half of `windows-accelerated` above.
  #
  # ⭐Only ONE of that job's two reasons for existing survives here, and the difference is the
  # whole reason this job is short: the TOOLCHAIN obstacle is Windows-only (MSVC cannot build
  # MPFR, hence the separate GNU toolchain + MSYS2 dance), while the standard Linux binary is
  # already built with gcc. What survives is the LICENSING: rug/gmp-mpfr-sys/GMP/MPFR are
  # LGPL-3.0-or-later against this project's MIT OR Apache-2.0, and those obligations attach to
  # conveying a binary — so this stays a separate, clearly-labelled download rather than becoming
  # the default one. `scripts/build-accelerated.sh` owns the build, the notices and the
  # verification; read its header before changing anything here.
  #
  # ⚠The `-dev` packages are what `use-system-libs` links against, and `m4` is only insurance for
  # the case where gmp-mpfr-sys falls back to building from source. ubuntu-22.04 matches the
  # standard `linux` job so both tarballs carry the same glibc floor.
  linux-accelerated:
    name: Linux x64 (accelerated, MPFR)
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Use stable Rust
        run: rustup default stable

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            m4 libgmp-dev libmpfr-dev \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Build and package
        run: |
          tag="${{ github.ref_name }}"
          if [ "$tag" = "main" ] || [ -z "$tag" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          [ -z "$tag" ] && tag="dev"
          # The in-app "Faster deep zoom" link builds its URL from the RUNNING version, so a git
          # tag that diverges from the Cargo version 404s for every user of this release. The app
          # side is pinned by a unit test; this is the other half. (Same guard as the Windows job.)
          chmod +x scripts/build-accelerated.sh
          ./scripts/build-accelerated.sh --tag "$tag" --out dist
          asset="$(ls dist/*-linux-x64-accelerated.tar.gz | head -1)"
          [ -n "$asset" ] || { echo "::error::no accelerated tarball produced"; exit 1; }
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release upload "$tag" "$ASSET" "$ASSET.sha256" --clobber

      - name: Upload artifact (manual/test runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: fractadyne-linux-x64-accelerated
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # BOTH accelerated jobs are included deliberately, even though they are OPTIONAL downloads: the
  # in-app "Faster deep zoom" link points at the asset for the running version AND PLATFORM, so a
  # published release missing either one is a dead link in a menu for half the users. Blocking the
  # publish keeps that impossible; the cost is that a broken accelerated build holds the release as
  # a draft until someone looks.
  publish:
    name: Publish release
    needs: [create-release, windows, linux, windows-accelerated, linux-accelerated]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          # --latest only for a stable tag; a pre-release must not become /releases/latest, which
          # is what the update checker's Stable track queries.
          case "$tag" in
            *-*) gh release edit "$tag" --draft=false ;;
            *)   gh release edit "$tag" --draft=false --latest ;;
          esac
          echo "published $tag with assets:"
          gh release view "$tag" --json assets --jq '.assets[].name'
