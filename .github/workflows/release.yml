name: Release

# Build and publish the Windows binary. Tag a release (e.g. `git tag v0.1.0 && git
# push --tags`) to build + attach the zip to a GitHub Release; or run manually
# (workflow_dispatch) to produce a downloadable test artifact without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Name for a manual test build (artifact only; not published)"
        required: false
        default: "dev"

permissions:
  contents: write # needed to create the release + upload assets

jobs:
  windows:
    name: Windows x64 binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use stable Rust
        run: rustup default stable

      # The standard release profile (matches local builds: no debuginfo, LTO off).
      # Runners aren't page-file constrained, but keeping the same profile avoids
      # shipping an untested optimization config.
      - name: Build release binary
        run: cargo build --release --bin fractadyne

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "main" -or [string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.event.inputs.tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "dev" }
          $dir = "fractadyne-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # The binary (self-contained: shaders + window icon are embedded).
          Copy-Item target/release/fractadyne.exe -Destination $dir/
          # Docs + licenses (incl. third-party dependency notices).
          Copy-Item README.md, CHANGELOG.md, TOURS.md, THIRD-PARTY-NOTICES.md, LICENSE-APACHE, LICENSE-MIT -Destination $dir/
          # Example guided-tour scripts (play in-app, or render headless with --render-tour).
          New-Item -ItemType Directory -Force -Path "$dir/tours" | Out-Null
          Copy-Item tours/*.toml -Destination "$dir/tours/"
          # Example scripting / profiling-region files.
          New-Item -ItemType Directory -Force -Path "$dir/scripts" | Out-Null
          Copy-Item scripts/*.example.toml -Destination "$dir/scripts/"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force
          $hash = (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $dir.zip" | Out-File -FilePath "$dir.zip.sha256" -Encoding ascii
          "ASSET=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Track selection by tag shape: a pre-release suffix (v0.3.0-beta.1 / -rc.1 / -alpha.1)
          # publishes as a GitHub *pre-release* (the "beta" track); a plain vX.Y.Z tag publishes as
          # a stable release and is marked "latest" (the "release" track). An update checker can then
          # query /releases/latest for stable, or the newest of /releases (incl. pre-releases) for beta.
          $args = @("$tag", "$env:ASSET", "$env:ASSET.sha256",
                    "--title", "Fractadyne $tag", "--generate-notes")
          if ($tag -match '-') { $args += "--prerelease" } else { $args += "--latest" }
          gh release create @args

      - name: Upload artifact (manual/test runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: fractadyne-windows-x64
          path: |
            *.zip
            *.zip.sha256
