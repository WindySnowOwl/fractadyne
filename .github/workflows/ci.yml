name: CI

# Gate every push/PR: run the exact-math core tests (CPU-only, cross-platform) and
# confirm the full workspace — including the GPU/egui crates — still compiles on the
# Windows target. The GPU `--selftest` needs a real GPU, so it stays a local/manual gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup default stable
      # fractadyne-core and fractadyne-state are pure Rust (no GUI/GPU/system deps), so they
      # test cleanly on Linux. Release build keeps the bignum tests fast.
      - run: cargo test -p fractadyne-core -p fractadyne-state --release

  build:
    name: Build workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup default stable
      - run: cargo build --workspace
