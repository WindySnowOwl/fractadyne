name: CI

# Manual-only — does NOT run automatically on push/PR (to control GitHub Actions usage). Trigger it
# explicitly from the repo's Actions tab ("Run workflow") or with `gh workflow run ci.yml`. It runs
# the exact-math core tests (CPU-only, cross-platform) and confirms the full workspace — including
# the GPU/egui crates — still compiles on the Windows target. The GPU `--selftest` needs a real GPU,
# so it stays a local gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup default stable
      # fractadyne-core and fractadyne-state are pure Rust (no GUI/GPU/system deps), so they
      # test cleanly on Linux. Release build keeps the bignum tests fast.
      - run: cargo test -p fractadyne-core -p fractadyne-state --release

  # The optional MPFR backend. It exists precisely BECAUSE it cannot be built on the Windows MSVC
  # target the rest of the project uses, so if it is not exercised here it is not exercised at all
  # — and the thing it must keep proving is that it stays BYTE-IDENTICAL to astro-float, which is
  # what lets the F3 corpus goldens gate both backends instead of one set per backend.
  #
  # Linux needs no MSYS2 (that is a Windows-only requirement); it needs the C toolchain
  # gmp-mpfr-sys builds GMP and MPFR with. `m4` is the one that is NOT already on the runner image.
  rug-backend:
    name: MPFR backend, byte-identity (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup default stable
      - name: System dependencies
        # make/gcc are on the image; m4 is not, and gmp-mpfr-sys' configure needs it. The rest are
        # for the app crate, which the A/B step below builds: --bench-bignum needs no GPU, but the
        # crate still LINKS eframe/winit/rfd, so their headers have to be present.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends m4 \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      # ⚠`c-no-tests` is not an optimization — by default gmp-mpfr-sys BUILDS AND RUNS the full
      # GMP and MPFR C test suites (~200 test binaries compiled, linked and executed), which is the
      # bulk of a first build. It is set in the workspace manifest; this comment is here because a
      # slow job is the symptom someone will come looking for.
      - name: Test with the rug backend
        run: cargo test -p fractadyne-core --release --features rug
      # The cost table, and a second independent check of byte-identity: --bench-bignum runs every
      # compiled-in backend over the same work in one process and exits non-zero if any row's
      # orbits differ. Informational as a NUMBER (a shared CI runner is not a benchmark machine),
      # load-bearing as a CHECK.
      - name: Backend A/B (identity is gating; timings are informational)
        run: cargo run -p fractadyne-app --release --features fractadyne-core/rug -- --bench-bignum --iters 0.15
        env:
          FRACTADYNE_NO_SOUND: "1"

  build:
    name: Build workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup default stable
      - run: cargo build --workspace

  # The GUI/GPU crates have never been compiled on Linux — `test` above only covers the two pure
  # ones. This is the job that answers "how far is a Linux build?", and it is deliberately pinned
  # to 22.04 rather than `latest`: a binary links against the glibc it was built with, so 22.04
  # (glibc 2.35) runs on Debian 12, Fedora 38+, Arch and 24.04, while a 24.04 build (2.39) refuses
  # to start on Debian 12 or 22.04 — a large share of the likely audience.
  build-linux:
    name: Build workspace (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup default stable
      # eframe/winit need X11 + Wayland + xkbcommon headers; rfd's file dialogs need GTK3 unless
      # built for the xdg portal. Mesa's Vulkan drivers give the runner a software adapter
      # (lavapipe) so the binary has something to initialise against — there is no GPU here.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            mesa-vulkan-drivers vulkan-tools xvfb libxkbcommon-x11-0
      - run: cargo build --workspace --release
      # INFORMATIONAL, never a gate. Software Vulkan is not the target and the goldens are exact
      # image comparisons, so failures here say "this is what a GPU-less Linux run looks like",
      # not "the port is broken". `|| true` keeps the job's verdict about COMPILATION.
      # The selftest builds an eframe event loop, which needs a DISPLAY even though the render
      # target is offscreen — xvfb-run provides one. Software Vulkan (lavapipe) is slow, so the
      # timeout is generous; the exact-image goldens may legitimately differ on a software
      # rasterizer, which is one more reason this step stays informational.
      - name: Smoke test (xvfb + software Vulkan, informational)
        continue-on-error: true
        run: |
          vulkaninfo --summary 2>&1 | head -30 || true
          ./target/release/fractadyne --version
          timeout 1200 xvfb-run -a ./target/release/fractadyne --selftest 2>&1 | tail -40 || true
