name: CI

# Manual-only — does NOT run automatically on push/PR (to control GitHub Actions usage). Trigger it
# explicitly from the repo's Actions tab ("Run workflow") or with `gh workflow run ci.yml`. It runs
# the exact-math core tests (CPU-only, cross-platform) and confirms the full workspace — including
# the GPU/egui crates — still compiles on the Windows target. The GPU `--selftest` needs a real GPU,
# so it stays a local gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup default stable
      # fractadyne-core and fractadyne-state are pure Rust (no GUI/GPU/system deps), so they
      # test cleanly on Linux. Release build keeps the bignum tests fast.
      - run: cargo test -p fractadyne-core -p fractadyne-state --release

  build:
    name: Build workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup default stable
      - run: cargo build --workspace

  # The GUI/GPU crates have never been compiled on Linux — `test` above only covers the two pure
  # ones. This is the job that answers "how far is a Linux build?", and it is deliberately pinned
  # to 22.04 rather than `latest`: a binary links against the glibc it was built with, so 22.04
  # (glibc 2.35) runs on Debian 12, Fedora 38+, Arch and 24.04, while a 24.04 build (2.39) refuses
  # to start on Debian 12 or 22.04 — a large share of the likely audience.
  build-linux:
    name: Build workspace (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup default stable
      # eframe/winit need X11 + Wayland + xkbcommon headers; rfd's file dialogs need GTK3 unless
      # built for the xdg portal. Mesa's Vulkan drivers give the runner a software adapter
      # (lavapipe) so the binary has something to initialise against — there is no GPU here.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            mesa-vulkan-drivers vulkan-tools xvfb
      - run: cargo build --workspace --release
      # INFORMATIONAL, never a gate. Software Vulkan is not the target and the goldens are exact
      # image comparisons, so failures here say "this is what a GPU-less Linux run looks like",
      # not "the port is broken". `|| true` keeps the job's verdict about COMPILATION.
      # The selftest builds an eframe event loop, which needs a DISPLAY even though the render
      # target is offscreen — xvfb-run provides one. Software Vulkan (lavapipe) is slow, so the
      # timeout is generous; the exact-image goldens may legitimately differ on a software
      # rasterizer, which is one more reason this step stays informational.
      - name: Smoke test (xvfb + software Vulkan, informational)
        continue-on-error: true
        run: |
          vulkaninfo --summary 2>&1 | head -30 || true
          ./target/release/fractadyne --version
          timeout 1200 xvfb-run -a ./target/release/fractadyne --selftest 2>&1 | tail -40 || true
