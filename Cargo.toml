# Fractadyne — Cargo workspace (see DESIGN.md §10).
# Virtual manifest; each crate lives under crates/.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.40-beta.67"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WindySnowOwl/fractadyne"
homepage = "https://github.com/WindySnowOwl/fractadyne"
documentation = "https://github.com/WindySnowOwl/fractadyne/blob/main/ARCHITECTURE.md"
keywords = ["fractal", "mandelbrot", "deep-zoom", "wgpu", "perturbation"]
categories = ["graphics", "visualization", "mathematics"]

# Shared lint policy — each crate opts in via `[lints] workspace = true`. Keeping the signals the
# organization audit relied on explicit and uniform stops per-developer drift across the workspace.
# Known, deferred violations carry a targeted `#[allow(...)]` that references a REFACTOR-PLAN phase,
# so the lint keeps guarding new code. Start at "warn"; tighten toward "deny" as phases land.
[workspace.lints.clippy]
too_many_arguments = "warn"
should_implement_trait = "warn"

# Shared dependency versions. The egui family is pinned to one version so the
# wgpu type used by fractadyne-gpu matches the one eframe owns (no duplicate wgpu).
[workspace.dependencies]
egui = "0.31"
egui-wgpu = "0.31"
eframe = { version = "0.31", default-features = false, features = [
  "wgpu",          # use the wgpu backend, not glow
  "default_fonts",
  "accesskit",
  "x11",           # linux: harmless on Windows/macOS (target-gated)
  "wayland",
] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
twofloat = "0.7"
astro-float = "0.9"
rfd = "0.15"
thiserror = "2"

# Internal crates
fractadyne-core = { path = "crates/fractadyne-core" }
fractadyne-gpu = { path = "crates/fractadyne-gpu" }
fractadyne-color = { path = "crates/fractadyne-color" }
fractadyne-render = { path = "crates/fractadyne-render" }
fractadyne-state = { path = "crates/fractadyne-state" }
fractadyne-export = { path = "crates/fractadyne-export" }

# This environment has a very small page file (low commit limit). Full debuginfo
# makes the wgpu/egui/eframe/naga rlibs huge (naga ~55 MB) and rustc then fails to
# mmap them (OS error 1455 "paging file too small"). Disabling debuginfo keeps the
# rlibs small enough to build here. Re-enable (e.g. debug = "line-tables-only")
# once the page file is larger.
[profile.dev]
debug = false

# Release build: optimized numerics (bignum is ~10–50× faster than the debug build).
# Same page-file constraint as dev → no debuginfo; LTO off and default codegen-units
# keep peak compile memory bounded on this machine.
[profile.release]
debug = false
lto = false
codegen-units = 16
