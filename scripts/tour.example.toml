# A minimal example camera tour. Full field reference: TOURS.md (or `fractadyne --dump-tour-schema`).
# Render it to a PNG sequence (+ optional mp4):
#   fractadyne --render-tour scripts/tour.example.toml --size 1920x1080 --fps 30 --ss 2 --out frames --mp4
# Frames are written <prefix>_00000.png (prefix defaults to this file's name; set with --prefix).
# This file also loads in the app via Tools → "Play script…".
#
# The tour glides (eased) between keyframes. Each [[keyframe]] adds `secs` seconds of travel from
# the previous one; a keyframe with no center inherits the previous center (handy for a pure
# zoom-in). `mag` is the magnification (use `mag_log10` past ~1e308×); `center_x`/`center_y` are
# full-precision decimal strings so deep targets are exact. `ease`, `hold`, `fractal`, `julia`,
# `dual`, `orbits`, and `[[caption]]`/`[[callout]]`/`[[spotlight]]` blocks are all optional — see
# TOURS.md for every field, and the richer tours under `tours/` for worked examples.

name = "Seahorse Valley dive"

[[keyframe]]
secs = 0          # start
center_x = "-0.743643887037158704752191506114774"
center_y = "0.131825904205311970493132056385139"
mag = 1.0
fractal = "Mandelbrot"

[[keyframe]]
secs = 6          # 6 s gliding to 1e6× (center inherited)
mag = 1.0e6

[[keyframe]]
secs = 6          # 6 more seconds to 1e12×
mag = 1.0e12
