# e72 install→render handoff repro — a FAST loop for the cliff in TODO.md
# ("the e72 reference build is on a knife edge").
#
# The grand tour reproduces it, but costs ~13 minutes per data point, which is the wrong
# instrument for chasing an ordering bug. This is the same failure in ~2 minutes: it keeps only
# the structure that matters — a hold whose reference is built for a 500,000 ask, immediately
# followed by a deeper hold asking 1,200,000 — and drops the eleven shallow keyframes ahead of it.
#
# ✅STATUS: REPRODUCES, in ~6 minutes rather than 13 —
#     hold-e72  FAIL  orbit_len 508193  eff_iter 1200000  black 0.276
# the grand tour's signature exactly. Three shapes were needed to get here, and each failure to
# reproduce eliminated a hypothesis, so keep all four elements:
#   * three holds (e55, e63, e72) — PASSES. The prefetch keeps three windows, so all three spawn
#     at once and e72 gets an enormous lead.
#   * four holds (+ e61) — PASSES. So "e72 must wait for a window" is NOT the cause.
#   * plus the continuous dive in — PASSES. So arriving with reference history is not it either.
#   * plus a DEEPER hold AFTER e72 (e82) — FAILS. That is the missing ingredient.
#
# WHAT TO LOOK FOR. On the grand tour the failure reads as `hold-e72` reporting
# `orbit_len 508193` against `eff_iter 1200000`: the previous hold's reference is still installed,
# so the shader clamps and the hold renders ~27% black where the offline truth is 0%.
#
#     FRACTADYNE_TRACE=ref fractadyne --livetest validation/e72-handoff.toml --size 480x270
#
# then read the `hold-prefetch spawn/install` pairs in config/logs/fractadyne.log. Attempt 1
# established the build is NOT the problem — the correct 1,208,193 reference finishes and installs
# for the correct window and the checkpoint still reads 508,193 — so the question is the
# install→render handoff at the window boundary. See TODO.md before changing anything.
#
# ⚠Same center and the same two asks as the grand tour's gauntlet, deliberately: this must fail
# for the SAME reason, not a similar one. If this repro ever passes while the grand tour fails,
# distrust the repro rather than the tour.

format_version = 2
name = "e72 handoff repro"

[render]
size = "480x270"
fps = 30
ss = 1
# The gauntlet renders with normalization on; deep escape fields alias into confetti without it,
# and the checkpoint's black fraction is what we are measuring.
normalize = true

[playback]
# Hold the clock at each hold until the view resolves, exactly as the grand tour does — without
# this the camera walks past a black frame instead of waiting, and the failure changes shape.
settled = true

[[location]]
id = "three-spar"
re = "-1.0109636384562213181006238475735192993836101418531854095957676926471683503366629508912671364125546238220995191834757e-1"
im = "9.5628651080914147131604703998237075557983304380930462483482733212267499793490593467836270525491219946548323699651521e-1"

# The CONTINUOUS DIVE in. Added after the two static-entry shapes above both passed: the grand
# tour reaches e55 through ~72 tour-seconds of descent, rebuilding references the whole way, and
# arriving with that history is the largest remaining difference from a cold entry. Gaps between
# the holds mirror the tour exactly (18 / 12 / 22 s) so the window contention matches.
[[keyframe]]
id = "dive-start"
t = 0
location = "three-spar"
zoom = 8
max_iter = 3000
hold = 2

[[keyframe]]
id = "dive-e10"
t = 10
zoom = "1e10"
max_iter = 20000
ease = "in"

[[keyframe]]
id = "dive-e30"
t = 38
zoom = "1e30"
max_iter = 60000
ease = "linear"

[[keyframe]]
id = "hold-e55"
t = 72
zoom = "1e55"
max_iter = 250000
ease = "linear"
hold = 6

# ⚠hold-e61 is REQUIRED, not scenery. The prefetch holds at most three windows, so with only
# three holds every build spawns immediately, e72 gets an enormous lead and the repro PASSES —
# measured, first version of this file. e72 must be the FOURTH hold, the first one that has to
# wait for a window to free before it can even start.
[[keyframe]]
id = "hold-e61"
t = 90
zoom = "1e61"
max_iter = 400000
ease = "linear"
hold = 6

# The 500,000 ask whose reference is the one that wrongly serves e72.
[[keyframe]]
id = "hold-e63"
t = 102
zoom = "1e63"
max_iter = 500000
ease = "linear"
hold = 6

# The 1,200,000 ask. This view genuinely needs ~1M; served by e63's 508,193 it renders ~27% black.
[[keyframe]]
id = "hold-e72"
t = 124
zoom = "1e72"
max_iter = 1200000
ease = "linear"
hold = 6

# ⚠hold-e82 is REQUIRED for the same reason hold-e61 is, and it is the element the first three
# shapes were missing. On the grand tour the deeper spawns fire WHILE e72 is still building —
# `spawn 1200000 @249.0`, then `spawn 2000000 @280.1` and `spawn 4000000 @306.9`, with e72's
# reference only landing at 367.4 — so e72's build is competing with them for CPU, not running
# alone. Without a competitor after it, e72 always wins and the repro passes.
[[keyframe]]
id = "hold-e82"
t = 148
zoom = "1e82"
max_iter = 2000000
ease = "linear"
hold = 6
