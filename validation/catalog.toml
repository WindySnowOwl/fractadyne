# Fractadyne validation catalog — independently verifiable locations.
#
# Every entry has a known, externally-checkable answer (a mathematical constant or a
# yes/no membership). `fractadyne --selftest` loads this file and verifies the build
# against it; a third party can confirm each answer with any trusted renderer or by hand.
# Coordinates are full-precision decimal strings. These double as "challenge coordinates":
# zoom to the location and you should find exactly the stated feature.

# --- minibrot nuclei: exact hyperbolic-component centers (period + coordinates) ---
# The finder must Newton-snap from `center` to `nucleus_*` and report `period`.

[[nucleus]]
name = "period-2 disk center (c = -1)"
center_x = "-1.001"
center_y = "0.001"
zoom = 50.0
period = 2
nucleus_x = "-1.0"
nucleus_y = "0.0"

