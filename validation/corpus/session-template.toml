# The F3-corpus render session — the ONLY settings a corpus render sees.
#
# Every corpus render runs with FRACTADYNE_CONFIG_DIR pointed at a throwaway directory holding a
# copy of THIS file, so a render depends on the exe, the --render command line, and this file --
# nothing else. It used to be built by patching ~17 keys into the DEVELOPER'S live session and
# inheriting the rest, which is why the July 2026 baselines could not be reproduced (the palette
# `cycle`/`offset`, `de`, `use_binary`, `normalize_live` and friends all rode along unpinned).
#
# ⚠Keep every image-affecting key EXPLICIT here even when it equals the app default: the point is
# that this file, not a default that may shift, is the contract. The catalog contract is
# 1280x720 2xSS, Ember palette, smooth iteration, no DE/lighting/HUD, exact per-location iterations.
# ⚠The location deliberately is NOT here -- it rides --center/--zoom-log2/--iter, and staging a
# deep view would make the app BOOT on it (an e500 session boot once hung a render for an hour).
# Regenerate/extend by hand; `generate_corpus.py` verifies the app actually LOADED it (the app
# logs `session: <path> -- loaded`, and falls back to defaults on a file it cannot parse).

