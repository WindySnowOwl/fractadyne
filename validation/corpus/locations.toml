note = "User-saved Fraktaler-3 location (me163.exr); 175-digit center. Renders CORRECTLY (matches F3): smooth bulb on the left, dense spiral dendrites on the right. FIXED v0.2.18 (BLA-landing rebase): the dendrite pixels escape at 928k-1.6M, PAST the reference orbit (~918k), so they must rebase at the reference's near-zero orbit dips; the GPU's BLA-skip path was skipping those dips without the Zhuoran rebase check (it assumed |delta z| stays small in the BLA regime, which fails at a dip where |Z|~=0), marching the deep pixels to the reference end and capping them at ~919k. Adding a rebase check at the BLA landing (mandelbrot.wgsl) restored the full escape range (measured 886k-1.6M, interior>0). Diagnosed with a faithful CPU df32 sim (probe_fe) that reproduced the correct escape values with the same reference, isolating BLA as the divergence. Rendered with --normalize (escape range -> palette). See TODO and loc 14's note."

