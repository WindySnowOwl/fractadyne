note = "User-saved Fraktaler-3 location (me148.exr); 161-digit center. Escape times measured 304k-582k (CPU perturbation probe), so 800k covers the view (rendered at 2xSS like the rest of the corpus, ~26s via the --normalize tiled path); the .exr's saved 6,000,000 was an exploration setting. This location exposed the sub-f32 reference-orbit dip bug (fixed in v0.2.6): its dive path passes within ~1e-71 of zero every 4383 iterations, and the flushed samples re-glued every pixel to the reference past ~1e142x. Renders CORRECTLY and matches F3 arm-for-arm (spiral-dendrite clusters). The earlier 'speckle' was NOT a render bug -- the escape VALUES are correct (verified 2026-07-12: GPU == a faithful CPU df32/df64 Fe transcription, tests/probe_fe.rs), but they are huge (~3e5-8e5) and vary steeply at this dense dendrite field, so the fixed palette cycle (0.27) ALIASED them into speckle. This render maps the frame's escape range to the palette (auto-normalized coloring) -- the correct structure emerges. Broader lesson: the app's fixed-cycle coloring aliases at extreme depth; auto-normalized coloring is the general fix (see TODO)."

