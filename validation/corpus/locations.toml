note = "User-saved Fraktaler-3 location (me148.exr); 161-digit center. Escape times measured 304k-582k (CPU perturbation probe), so 800k covers the view (rendered at 1xSS: the ~0.5M-iteration escape band makes 2xSS a multi-hour render); the .exr's saved 6,000,000 was an exploration setting. This location exposed the sub-f32 reference-orbit dip bug (fixed in v0.2.6): its dive path passes within ~1e-71 of zero every 4383 iterations, and the flushed samples re-glued every pixel to the reference past ~1e142x. ACCURACY-LIMITED: the interior renders as per-pixel escape-time SPECKLE NOISE from a mode-2 perturbation-accuracy bug at this dip-carrying orbit -- NOT glitches (the render logs glitch=0 at full res; forcing correction on flags only ~42/57600 px yet the image stays noise) and NOT BLA (a BLA-off render is equally noisy). Every pixel escapes (maxiter=0) but at noisy counts, from the heavy rebasing/extended-range-sample handling at the ~1e-71 dips; v0.2.6 fixed the uniform-interior blank but left this. Overall structure/boundary placement matches F3; the interior detail does NOT, pending the perturbation-accuracy fix (TODO.md Open bugs)."

