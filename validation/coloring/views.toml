# The coloring matrix's view set (`--coloring-matrix`, design/coloring-plan.md B1).
#
# Each [[view]] is rendered once per coloring method and variant (every method of the table, the
# orbit trap once per shape, the stripe average once more over the tail only); a family that does
# not offer a method (Distance without a distance estimate) records that cell as n/a.
#
# Keys: name (lowercase, digits, '-'; unique), fractal (as the app names it; default Mandelbrot),
# formula (a custom formula's step; the family is then Custom), julia_c = [re, im] (Julia mode),
# center = [re, im] (text, full precision; default the family's own center), zoom (magnification as
# text, default 1), fdn (take the family, center and zoom from a view file instead), iter
# (required), quick (part of --quick), opt_in (runs only when --only names it), note.
#
# The deep points of the power families are the self-test's FOLD_DEEP and MULTIBROT_DEEP (the
# core's fixtures, good to about 2^-112), copied here so they are no longer self-test only.
#
# [[known]] records a red cell that is understood: cell = "view/variant" (or "*/variant" for
# every view), check = the failed check's name, reason. A known red cell is reported, not counted.

