# ---- Red cells that are understood (2026-11-11, the first full run on the RTX 3080) ----

[[known]]
cell = "*/stripe-tail"
check = "bla"
reason = "The stripe tail is approximate across a BLA skip and the series seed: a skipped span folds into the tail's moving average as if every term in it were the span's mean (aux_fold_run), and the seed folds the prefix where each pixel has already drifted from the reference (the A5a note in mandelbrot.wgsl). TODO."

[[known]]
cell = "*/stripe-tail"
check = "series"
reason = "The stripe tail is approximate across a BLA skip and the series seed: a skipped span folds into the tail's moving average as if every term in it were the span's mean (aux_fold_run), and the seed folds the prefix where each pixel has already drifted from the reference (the A5a note in mandelbrot.wgsl). TODO."

[[known]]
cell = "*/stripe-tail"
check = "bla+series"
reason = "The stripe tail is approximate across a BLA skip and the series seed: a skipped span folds into the tail's moving average as if every term in it were the span's mean (aux_fold_run), and the seed folds the prefix where each pixel has already drifted from the reference (the A5a note in mandelbrot.wgsl). TODO."

[[known]]
cell = "newton-overview/*"
check = "flat"
reason = "Newton writes no statistics: a converged pixel returns AUX_NONE (mandelbrot.wgsl), so stripe, triangle, the traps and decomposition draw one color. The method box and the Color menu still offer them (TODO: offer them only where the family computes them)."

[[known]]
cell = "*/distance"
check = "nan"
reason = "BUG (TODO): where the derivative overflows f32 (slow escapes on Multibrot 3-8 and Phoenix, deep filaments), de_log2 squares it to infinity, the distance is -inf, and the color pass makes NaN of it. The NaN pixels' iteration data reads DE -inf."

[[known]]
