# Fractadyne GRAND TOUR — the demo reel and the regression gauntlet in one script.
#
# Two jobs, deliberately combined:
#
#  1. DEMO. A guided pass over the famous landmarks, the mathematically exact ones,
#     and the app's distinguishing features (dual Julia, orbit overlay, fractal
#     families), narrated with captions and callouts.
#
#  2. REGRESSION. The final chapter dives through the Misiurewicz three-spar family
#     — the location family that produced SEVEN separate rendering bugs (v0.2.40
#     beta.19 / 22 / 26 / 27 / 28 / 30 / 32). Every one was a heuristic tuned at one
#     depth failing at the next, so the dive HOLDS at each depth that broke us:
#     1.7e55, 3.3e61, 6.3e63, 2.6e72, 2.0e82, 6.5e94. A flat or black frame at any
#     of those holds is a regression. They share one center, so a single continuous
#     dive visits them all.
#
#   Play in-app:  Tools -> Play script...
#   Render movie: fractadyne --render-tour tours/grand-tour.toml \
#                   --fps 30 --size 1920x1080 --ss 2 --out frames --mp4
#   Regression:   render at low fps/size (e.g. --fps 2 --size 640x360) and inspect
#                 the hold frames; the deep chapter is where the cost is.
#
# Timeline is ~232 s. Caption `at` times below are absolute seconds and were computed
# from the cumulative keyframe secs+hold — edit them together.
name = "Fractadyne Grand Tour"
format_version = 1
palette = "Ember"

# The spar chapter needs a big budget; the shallow chapters must NOT pay for it (an exact
# count applies everywhere and the home view alone then costs minutes a frame). auto_iter
# keeps it depth-scaled, and this base rides at `recommended_max_iter`'s 2M ceiling where the
# dive needs it. NOTE: the deepest holds (1e94x) still come out a few percent capped — they
# want ~8M, which no single script-wide number can express without crippling the shallow
# frames. PER-KEYFRAME `max_iter` is the format fix; see TODO.
max_iter = 2000000
auto_iter = true

# ============================================================ 1. The whole set
[[keyframe]]
secs = 0
center_re = "-0.5"
center_im = "0.0"
mag = 1.33333
fractal = "Mandelbrot"
hold = 5

# ============================================================ 2. Famous landmarks
# Seahorse Valley — the classic first destination.
[[keyframe]]
secs = 6
center_re = "-0.743643887037151"
center_im = "0.131825904205330"
mag = 2667
ease = "smooth"
hold = 3
[[keyframe]]
secs = 5
mag = 13330000
ease = "smooth"
hold = 3

# Elephant Valley — the procession off the cardioid's cusp.
[[keyframe]]
secs = 6
center_re = "0.2925755"
center_im = "-0.0149977"
mag = 2000
ease = "smooth"
hold = 3

# Triple Spiral Valley — three-fold symmetry off the period-3 bulb.
[[keyframe]]
secs = 6
center_re = "-0.088643135"
center_im = "0.654461185"
mag = 1600
ease = "smooth"
hold = 3

# ============================================================ 3. Exact points
# Back out, then visit two points whose mathematics is exactly known.
[[keyframe]]
secs = 4
center_re = "-0.5"
center_im = "0.0"
mag = 1.33333
ease = "smooth"
hold = 1

# The antenna tip, c = -2 exactly. Misiurewicz (2,1): the critical orbit lands on the
# repelling fixed point 2, whose multiplier is exactly 4 — real, so the structure
# repeats under zoom WITHOUT spiralling. The cleanest self-similarity in the set.
[[keyframe]]
secs = 5
center_re = "-2.0"
center_im = "0.0"
mag = 8
ease = "smooth"
hold = 4
[[keyframe]]
secs = 5
mag = 5000
ease = "smooth"
hold = 3

# c = i exactly. Misiurewicz (2,2): the orbit reaches the 2-cycle {-1+i, -i} and the
# multiplier is 4(1+i) — argument 45 degrees, so this one twists as it repeats.
[[keyframe]]
secs = 6
center_re = "0.0"
center_im = "1.0"
mag = 8
ease = "smooth"
hold = 4
[[keyframe]]
secs = 5
mag = 3000
ease = "smooth"
hold = 3

# ============================================================ 4. Features
# Dual view: the Mandelbrot set beside the Julia set of the point under the cursor.
[[keyframe]]
secs = 5
center_re = "-0.5"
center_im = "0.0"
mag = 1.33333
dual = true
julia_re = -0.122561
julia_im = 0.744862
ease = "smooth"
hold = 5

# Slide c along the boundary — the Julia set morphs continuously with it.
[[keyframe]]
secs = 6
dual = true
julia_re = -0.743643
julia_im = 0.131825
ease = "linear"
hold = 4

# Orbit overlay: the actual path of z under iteration, drawn over the set.
[[keyframe]]
secs = 4
dual = false
orbits = true
orbit_re = -0.743643
orbit_im = 0.131825
ease = "smooth"
hold = 5

# A different family entirely — the escape-time engine is not Mandelbrot-only.
[[keyframe]]
secs = 4
fractal = "Burning Ship"
center_re = "-1.7"
center_im = "-0.03"
mag = 60
orbits = false
ease = "smooth"
hold = 4

# ============================================================ 5. The gauntlet
# Back to the Mandelbrot set and onto the three-spar center for the deep dive.
[[keyframe]]
secs = 4
fractal = "Mandelbrot"
center_re = "-0.5"
center_im = "0.0"
mag = 1.33333
ease = "smooth"
hold = 2

# Swoop onto the exact dive center at low zoom FIRST (panning while deep-zooming
# drives the camera through the set's black interior), then hold the center fixed
# for the whole descent. This center is the deepest verified point of the family.
[[keyframe]]
secs = 5
center_re = "-1.0109636384562213181006238475735192993836101418531854095957676926471683503366629508912671364125546238220995191834757e-1"
center_im = "9.5628651080914147131604703998237075557983304380930462483482733212267499793490593467836270525491219946548323699651521e-1"
mag = 8
ease = "smooth"
hold = 2

[[keyframe]]
secs = 8
mag_log10 = 10.0
ease = "in"
[[keyframe]]
secs = 14
mag_log10 = 30.0
ease = "linear"

# --- regression holds: each depth below is a bug this family produced ---
# 1.7e55 / 5.17e55 — beta.19: the adaptive iteration budget itself (smooth "capped
# blobs" where the export showed dendrites), and its stale-baseline plateau.
[[keyframe]]
secs = 14
mag_log10 = 55.0
ease = "linear"
hold = 3
# 3.3e61 — beta.26: the plateau detector latched after ONE flat raise; capped
# fraction sits at exactly 100% through x1.6 and x2.6 before collapsing at x4.1.
[[keyframe]]
secs = 6
mag_log10 = 61.0
ease = "linear"
hold = 3
# 6.3e63 — beta.27: LIVE_REF_CAP truncated a reference that escapes at 256,753,
# 753 iterations past the cap -> partial -> pixel clamp -> blobs.
[[keyframe]]
secs = 4
mag_log10 = 63.0
ease = "linear"
hold = 3
# 2.6e72 — beta.28: the 500k iteration ceiling (this view needs ~1M), and the
# clamped-budget deadlock it exposed in the reference extension.
[[keyframe]]
secs = 9
mag_log10 = 72.0
ease = "linear"
hold = 3
# 2.0e82 — beta.30: the 128 MB storage-binding wall. The reference here escapes at
# 928,084 samples — 112 past the old ~928k device cap.
[[keyframe]]
secs = 11
mag_log10 = 82.0
ease = "linear"
hold = 3
# 6.5e94 — beta.32: the plateau detector again. This view needs ~39x the depth-scaled
# cap before a single pixel escapes; three flat steps "proved" interior and reverted
# to a black screen.
[[keyframe]]
secs = 13
mag_log10 = 94.81
ease = "out"
hold = 8

