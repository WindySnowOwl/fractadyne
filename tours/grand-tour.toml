# Fractadyne GRAND TOUR — the demo reel and the regression gauntlet in one script.
#
# Two jobs, deliberately combined:
#
#  1. DEMO. A guided pass over the famous landmarks, the mathematically exact ones,
#     and the app's distinguishing features (dual Julia, orbit overlay, fractal
#     families), narrated with captions and callouts.
#
#  2. REGRESSION. The final chapter dives through the Misiurewicz three-spar family
#     — the location family that produced SEVEN separate rendering bugs (v0.2.40
#     beta.19 / 22 / 26 / 27 / 28 / 30 / 32). Every one was a heuristic tuned at one
#     depth failing at the next, so the dive HOLDS at each depth that broke us:
#     1.7e55, 3.3e61, 6.3e63, 2.6e72, 2.0e82, 6.5e94. A flat or black frame at any
#     of those holds is a regression. They share one center, so a single continuous
#     dive visits them all.
#
#   Play in-app:  Tools -> Play script...
#   Render movie: fractadyne --render-tour tours/grand-tour.toml --out frames --mp4
#                 (size/fps/ss come from [render] below; flags still override)
#   One chapter:  fractadyne --render-tour tours/grand-tour.toml --segment gauntlet
#   Regression:   render at low fps/size (e.g. --fps 2 --size 640x360) and inspect
#                 the hold frames; the deep chapter is where the cost is.
#
# Timeline is 331 s. Every `t` is ABSOLUTE seconds from the start — keyframes and
# narration can be edited independently without recomputing anything downstream.
#
# The deep chapter descends at roughly half a decade per second. It used to run at one
# decade per second, and no deep view can resolve at that rate: the reference rebuild alone
# costs seconds past 1e60x, so the camera outran the renderer and the dive was watched
# through frames that never finished. Slower is not padding here — it is the difference
# between seeing the structure and seeing the budget lose.
format_version = 2
name = "Fractadyne Grand Tour"

[render]
size = "1920x1080"
fps = 30
ss = 2

# Live playback only; an offline render always computes every frame to completion regardless.
# `settled` stops the tour clock at each hold until the view resolves, so a deep hold gets the
# extra seconds its iteration budget needs to climb instead of being walked past while black.
#
# The timeout is what makes this watchable, and it was measured, not guessed: at 90s the tour
# stalled (a 320-second stretch with no reference build at all), while at 15s it played steadily
# start to finish in 286s of wall clock against its authored 232s. Exhaustively resolving the
# deepest holds takes far longer than any watchable number — that question belongs to
# `--livetest`, which can wait as long as it likes because nobody is watching it.
[playback]
pace = "settled"
settle_timeout = 15

# Each keyframe carries its own iteration budget (interpolated geometrically along
# the glides), so the shallow chapters cost a few thousand iterations a frame while
# the spar holds get the millions they need. One script-wide number can do neither:
# an exact count makes the 1.33x home view cost minutes a frame, and a depth-scaled
# base leaves the deepest holds capped.
#
# The deepest hold is set to 4M rather than the ~8M it would take to fully resolve:
# the offline path builds the NEXT frame's reference while this one renders, so the
# peak is two references at once (~2.3 GB each at 379-bit precision, plus their BLA
# tables) and 8M ran a 32 GB machine out of memory mid-dive. At 4M the 6.5e94x hold
# is still a few percent capped - that depth is at the edge of what this build can
# resolve at all (see the 1e95 wall in TODO.md), not a limit of the script format.

# ============================================================ named coordinates
[[location]]
id = "home"
re = "-0.5"
im = "0.0"
zoom = 1.33333
note = "Classic whole-set framing."

[[location]]
id = "seahorse"
re = "-0.743643887037151"
im = "0.131825904205330"

[[location]]
id = "elephant"
re = "0.2925755"
im = "-0.0149977"

[[location]]
id = "triple-spiral"
re = "-0.088643135"
im = "0.654461185"

[[location]]
id = "antenna-tip"
re = "-2.0"
im = "0.0"
note = "c = -2 exactly. Misiurewicz (2,1); multiplier exactly 4."

[[location]]
id = "c-equals-i"
re = "0.0"
im = "1.0"
note = "c = i exactly. Misiurewicz (2,2); multiplier 4(1+i)."

# The three-spar dive center — the deepest verified point of the family. Written
# once here and referenced by the dive keyframe and the spotlight.
[[location]]
id = "three-spar"
re = "-1.0109636384562213181006238475735192993836101418531854095957676926471683503366629508912671364125546238220995191834757e-1"
im = "9.5628651080914147131604703998237075557983304380930462483482733212267499793490593467836270525491219946548323699651521e-1"

# ============================================================ chapters
[[segment]]
id = "whole-set"
title = "1. The whole set"
t = 0

[[segment]]
id = "landmarks"
title = "2. Famous landmarks"
t = 5

[[segment]]
id = "exact-points"
title = "3. Points known exactly"
t = 55

[[segment]]
id = "features"
title = "4. Features"
t = 95

[[segment]]
id = "gauntlet"
title = "5. The deep gauntlet"
t = 132

# ============================================================ 1. The whole set
[[keyframe]]
id = "open"
t = 0
location = "home"
fractal = "Mandelbrot"
palette = "Ember"
max_iter = 2000
hold = 5

# ============================================================ 2. Famous landmarks
#
# Every landmark is approached the same way: PAN at the home zoom, where the whole set is on
# screen, and only then zoom in. Moving the centre while still zoomed in flies the camera through
# the set's INTERIOR — the straight line from Seahorse Valley to Elephant Valley passes through
# the middle of the cardioid, so at 1e5x every frame between them is solid black. (This is the
# same reason the deep chapter swoops onto its centre at zoom 8 before descending.) The general
# fix is a Van Wijk-Nuij path, which derives "zoom out, pan, zoom in" in closed form instead of
# making every author remember it — see the autopilot section of TODO.md.

# Seahorse Valley — the classic first destination.
[[keyframe]]
id = "approach-seahorse"
t = 9
location = "seahorse"
zoom = 1.33333
max_iter = 2000
[[keyframe]]
id = "seahorse-1"
t = 14
zoom = 2667
max_iter = 4000
hold = 3
[[keyframe]]
id = "seahorse-2"
t = 22
zoom = 13330000
max_iter = 12000
hold = 3

# Elephant Valley — the procession off the cardioid's cusp. Back out in place first, then pan.
[[keyframe]]
id = "back-out-seahorse"
t = 29
zoom = 1.33333
max_iter = 2000
[[keyframe]]
id = "approach-elephant"
t = 33
location = "elephant"
zoom = 1.33333
[[keyframe]]
id = "elephant"
t = 37
zoom = 2000
max_iter = 4000
hold = 3

# Triple Spiral Valley — three-fold symmetry off the period-3 bulb.
[[keyframe]]
id = "back-out-elephant"
t = 44
zoom = 1.33333
max_iter = 2000
[[keyframe]]
id = "approach-triple-spiral"
t = 48
location = "triple-spiral"
zoom = 1.33333
[[keyframe]]
id = "triple-spiral"
t = 52
zoom = 1600
max_iter = 4000
hold = 3

# ============================================================ 3. Exact points
# Back out, then visit two points whose mathematics is exactly known. Note the two steps: zoom
# out IN PLACE, then pan. One keyframe doing both would interpolate them together and fly the
# camera across the cardioid's interior while still at 1e2x — solid black frames.
[[keyframe]]
id = "back-out-triple-spiral"
t = 57
zoom = 1.33333
max_iter = 2000
[[keyframe]]
id = "back-out-1"
t = 59
location = "home"
max_iter = 2000
hold = 1

# The antenna tip, c = -2 exactly. Misiurewicz (2,1): the critical orbit lands on the
# repelling fixed point 2, whose multiplier is exactly 4 — real, so the structure
# repeats under zoom WITHOUT spiralling. The cleanest self-similarity in the set.
[[keyframe]]
id = "antenna-tip"
t = 65
location = "antenna-tip"
zoom = 8
max_iter = 3000
hold = 4
[[keyframe]]
id = "antenna-tip-deep"
t = 74
zoom = 5000
max_iter = 6000
hold = 3

# c = i exactly. Misiurewicz (2,2): the orbit reaches the 2-cycle {-1+i, -i} and the
# multiplier is 4(1+i) — argument 45 degrees, so this one twists as it repeats.
[[keyframe]]
id = "c-equals-i"
t = 83
location = "c-equals-i"
zoom = 8
max_iter = 3000
hold = 4
[[keyframe]]
id = "c-equals-i-deep"
t = 92
zoom = 3000
max_iter = 6000
hold = 3

# ============================================================ 4. Features
# Zoom out in place before leaving c = i (see chapter 3), then pan at the home zoom.
[[keyframe]]
id = "back-out-c-equals-i"
t = 97
zoom = 1.33333
max_iter = 2000

# Dual view: the Mandelbrot set beside the Julia set of the point under the cursor.
[[keyframe]]
id = "dual-open"
t = 100
location = "home"
max_iter = 2000
dual = true
julia_re = -0.122561
julia_im = 0.744862
hold = 5

# Slide c along the boundary — the Julia set morphs continuously with it.
[[keyframe]]
id = "dual-slide"
t = 111
julia_re = -0.743643
julia_im = 0.131825
ease = "linear"
hold = 4

# Orbit overlay: the actual path of z under iteration, drawn over the set.
[[keyframe]]
id = "orbit-overlay"
t = 119
dual = false
orbits = true
orbit_re = -0.743643
orbit_im = 0.131825
hold = 5

# A different family entirely — the escape-time engine is not Mandelbrot-only.
[[keyframe]]
id = "burning-ship"
t = 128
fractal = "Burning Ship"
re = "-1.7"
im = "-0.03"
zoom = 60
orbits = false
hold = 4

# ============================================================ 5. The gauntlet
# Back to the Mandelbrot set and onto the three-spar center for the deep dive.
[[keyframe]]
id = "back-out-2"
t = 136
fractal = "Mandelbrot"
location = "home"
max_iter = 2000
hold = 2

# Swoop onto the exact dive center at low zoom FIRST (panning while deep-zooming
# drives the camera through the set's black interior), then hold the center fixed
# for the whole descent.
[[keyframe]]
id = "dive-start"
t = 143
location = "three-spar"
zoom = 8
max_iter = 3000
hold = 2

[[keyframe]]
id = "dive-e10"
t = 153
zoom = "1e10"
max_iter = 20000
ease = "in"
[[keyframe]]
id = "dive-e30"
t = 181
zoom = "1e30"
max_iter = 60000
ease = "linear"

# --- regression holds: each depth below is a bug this family produced ---
# 1.7e55 / 5.17e55 — beta.19: the adaptive iteration budget itself (smooth "capped
# blobs" where the export showed dendrites), and its stale-baseline plateau.
[[keyframe]]
id = "hold-e55"
t = 215
zoom = "1e55"
max_iter = 250000
ease = "linear"
hold = 6
# 3.3e61 — beta.26: the plateau detector latched after ONE flat raise; capped
# fraction sits at exactly 100% through x1.6 and x2.6 before collapsing at x4.1.
[[keyframe]]
id = "hold-e61"
t = 233
zoom = "1e61"
max_iter = 400000
ease = "linear"
hold = 6
# 6.3e63 — beta.27: LIVE_REF_CAP truncated a reference that escapes at 256,753,
# 753 iterations past the cap -> partial -> pixel clamp -> blobs.
[[keyframe]]
id = "hold-e63"
t = 245
zoom = "1e63"
max_iter = 500000
ease = "linear"
hold = 6
# 2.6e72 — beta.28: the 500k iteration ceiling (this view needs ~1M), and the
# clamped-budget deadlock it exposed in the reference extension.
[[keyframe]]
id = "hold-e72"
t = 267
zoom = "1e72"
max_iter = 1200000
ease = "linear"
hold = 6
# 2.0e82 — beta.30: the 128 MB storage-binding wall. The reference here escapes at
# 928,084 samples — 112 past the old ~928k device cap.
[[keyframe]]
id = "hold-e82"
t = 291
zoom = "1e82"
max_iter = 2000000
ease = "linear"
hold = 6
# 6.5e94 — beta.32: the plateau detector again. This view needs ~39x the depth-scaled
# cap before a single pixel escapes; three flat steps "proved" interior and reverted
# to a black screen.
[[keyframe]]
id = "hold-e94"
t = 321
zoom = "6.46e94"
max_iter = 4000000
ease = "out"
hold = 10

