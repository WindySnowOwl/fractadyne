# Fractadyne guided tour: how the Julia sets relate to the Mandelbrot set, using
# the linked dual view, then a look at the escape-time orbit that defines both.
#
#   Best played live:  Tools -> Play script...
#   (also renders: fractadyne --render-tour tours/julia-and-mandelbrot.toml --fps 30 --size 1920x1080 --ss 2 --out frames)
name = "Julia sets & the Mandelbrot set"
format_version = 1
palette = "Ember"

# --- overview ---
[[keyframe]]
secs = 0
center_x = "-0.5"
center_y = "0.0"
mag = 1
hold = 4

# --- dual view: every point c has a Julia set (marker shows c on the left) ---
[[keyframe]]
secs = 2.5
dual = true
julia_re = -0.4
julia_im = 0.6
hold = 5

[[keyframe]]        # deep in a bulb — a connected, tiled Julia set
secs = 3
julia_re = -0.123
julia_im = 0.745
hold = 5

[[keyframe]]        # Seahorse Valley c — a delicate dendrite
secs = 3
julia_re = -0.75
julia_im = 0.11
hold = 5

[[keyframe]]        # a spiral Julia
secs = 3
julia_re = -0.8
julia_im = 0.156
hold = 5

[[keyframe]]        # c OUTSIDE the set — the Julia set shatters into dust
secs = 3
julia_re = 0.35
julia_im = 0.4
hold = 5

# --- back to a single view: the orbit that decides membership ---
[[keyframe]]
secs = 2.5
dual = false
center_x = "-0.5"
center_y = "0.0"
mag = 1
orbits = true
orbit_re = -0.5
orbit_im = 0.0
hold = 5

[[keyframe]]        # move the orbit point outside — it escapes to infinity
secs = 1
orbit_re = 0.35
orbit_im = 0.42
hold = 5

# --- narration ---
[[caption]]
text = "The Mandelbrot Set"
at = 0.2
secs = 3.5
pos = "center"
size = 32
[[caption]]
text = "Every point c has its own Julia set — shown on the right"
at = 6.5
secs = 4.5
pos = "bottom"
[[caption]]
text = "Inside the Mandelbrot set, the Julia set is one connected piece"
at = 14.0
secs = 5.5
pos = "bottom"
[[caption]]
text = "Near the boundary: dendrites and spirals — infinitely intricate"
at = 25.0
secs = 8.0
pos = "bottom"
[[caption]]
text = "Cross outside the set, and the Julia set shatters into dust"
at = 37.0
secs = 5.5
pos = "bottom"
[[caption]]
text = "Why? Iterate z -> z*z + c from 0. This orbit stays bounded..."
at = 45.5
secs = 6.0
pos = "top"
[[caption]]
text = "...so c is in the set. Move c out, and the orbit escapes to infinity."
at = 54.0
secs = 6.0
pos = "top"
