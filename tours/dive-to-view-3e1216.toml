# Fractadyne tour - generated by "Script to current view".
# Zooms from the full view to a saved location. Play: Tools -> Play script;
# render: fractadyne --render-tour <this file> --out frames --mp4.
format_version = 2
name = "Dive to view"

[render]
size = "1920x1080"
fps = 30

[[location]]
id = "target"
re = "-1.-1"
im = "9.-1"

[[keyframe]]            # full view
id = "home"
t = 0.0
fractal = "Mandelbrot"
re = "-0.5"
im = "0"
zoom = 1.0
max_iter = 2000
hold = 1.5

[[keyframe]]            # recenter onto the target (still zoomed out)
id = "recenter"
t = 5.5
location = "target"
zoom = 8.0
max_iter = 3000
ease = "smooth"
hold = 0.5

[[keyframe]]            # dive in (center fixed - inherited from above)
id = "dive"
t = 806.0
zoom = "3.0938e1216"
max_iter = 2000000
ease = "out"        # decelerate onto the point
hold = 2.0

[[annotation]]
kind = "caption"
text = "Zoom to 3e1216"
t = 0.0
secs = 804
