# Fractadyne guided tour: a straight dive from the full Mandelbrot set down to the
# Misiurewicz (4,1) "three-spar" branch point - its exact center at ~5.17e838x
# (validation/misiurewicz-4-1.fdn). The critical orbit reaches the repelling fixed
# point after 4 steps; the three-spar structure is self-similar, so it looks the
# same at every scale on the way down.
#
#   Play in-app:  Tools -> Play script...
#   Render movie: fractadyne --render-tour tours/dive-to-misiurewicz-4-1.toml --out frames --mp4
#
# NOTE: this reaches ~10^838x. Playback is smooth (reprojection + orbit reuse);
# a full movie render is heavier - the deepest frames build ~880-digit references.
format_version = 2
name = "Dive to Misiurewicz (4,1)"

[render]
size = "1920x1080"
fps = 30
ss = 2

# Live playback only; an offline render always computes every frame to completion regardless.
# `settled` stops the tour clock at each hold until the view resolves, so a deep hold gets the
# extra seconds its iteration budget needs to climb instead of being walked past while black.
#
# The timeout is what makes this watchable, and it was measured, not guessed: at 90s the tour
# stalled (a 320-second stretch with no reference build at all), while at 15s it played steadily
# start to finish in 286s of wall clock against its authored 232s. Exhaustively resolving the
# deepest holds takes far longer than any watchable number — that question belongs to
# `--livetest`, which can wait as long as it likes because nobody is watching it.
[playback]
pace = "settled"
settle_timeout = 15

[[location]]
id = "home"
re = "-0.5"
im = "0.0"
zoom = 1.33333

[[location]]
id = "three-spar"
re = "-1.-1"
im = "9.-1"
note = "Misiurewicz (4,1) exact branch center; validation/misiurewicz-4-1.fdn."

[[segment]]
id = "overview"
title = "The whole set"
t = 0

[[segment]]
id = "descent"
title = "The descent to 10^838x"
t = 7.5

# --- the whole set, classic framing; hold to take it in ---
[[keyframe]]
id = "open"
t = 0
location = "home"
palette = "Ice"
max_iter = 2000
hold = 2.5

# --- swoop up onto the three-spar's exact center while zooming in a little
#     (from here down the center is fixed - inherited - so the dive stays perfectly
#     centered on the point) ---
[[keyframe]]
id = "on-target"
t = 6.5
location = "three-spar"
zoom = 8.0
max_iter = 3000
ease = "smooth"
hold = 1.0

# --- the dive (center fixed): accelerate in, cruise at a constant rate, decelerate
#     onto the point. Deep zooms are written as strings, so the >1e308 range is exact. ---
[[keyframe]]
id = "dive-e40"
t = 13.5
zoom = "1e40"
max_iter = 30000
ease = "in"
[[keyframe]]
id = "dive-e300"
t = 143.5
zoom = "1e300"
max_iter = 300000
ease = "linear"
[[keyframe]]
id = "dive-e560"
t = 273.5
zoom = "1e560"
max_iter = 600000
ease = "linear"
[[keyframe]]
id = "arrive"
t = 873.5
zoom = "5.166e838"
max_iter = 1200000
ease = "out"
hold = 6

# --- narration (timed to the 879.5s / 14.6-min timeline: full-set hold to 2.5s,
#     swoop to 7.5s, accelerate to 10^40x by 13.5s, cruise 40->300 to 143.5s and
#     300->560 to 273.5s, then a long decelerating tail onto 10^838.7x by 873.5s) ---
[[annotation]]
kind = "caption"
text = "The Mandelbrot Set"
t = 0.3
secs = 2.2
pos = "center"
size = 34
[[annotation]]
kind = "caption"
text = "Diving to a Misiurewicz point - an exact branch center"
t = 8.0
secs = 6.0
[[annotation]]
kind = "caption"
text = "The same three-spar, at every scale"
t = 55.0
secs = 8.0
[[annotation]]
kind = "caption"
text = "Self-similar without end"
t = 180.0
secs = 8.0
[[annotation]]
kind = "caption"
text = "Past 10^500x - and the shape holds"
t = 300.0
secs = 8.0
[[annotation]]
kind = "caption"
text = "The zoom eases as it nears the exact center"
t = 520.0
secs = 9.0
[[annotation]]
kind = "caption"
text = "A pre-periodic branch center - not a minibrot"
t = 720.0
secs = 9.0
[[annotation]]
kind = "caption"
text = "Misiurewicz (4,1)  -  5.17 x 10^838 x"
t = 866.0
secs = 10.0
size = 26
