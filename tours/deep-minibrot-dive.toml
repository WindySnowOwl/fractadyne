# Fractadyne guided tour: overview of the Mandelbrot set, a look at its landmark
# features, then a smooth ~10^30x dive into Seahorse Valley ending on a real
# minibrot (a period-16014 island, verified with --find-minibrot).
#
#   Play in-app:  Tools -> Play script...
#   Render movie: fractadyne --render-tour tours/deep-minibrot-dive.toml --out frames
#                 (size/fps/ss come from [render]; CLI flags override)
format_version = 2
name = "Deep dive to a minibrot"

[render]
size = "1920x1080"
fps = 30
ss = 2

# Live playback only; an offline render always computes every frame to completion regardless.
# `settled` stops the tour clock at each hold until the view resolves, so a deep hold gets the
# extra seconds its iteration budget needs to climb instead of being walked past while black.
#
# The timeout is what makes this watchable, and it was measured, not guessed: at 90s the tour
# stalled (a 320-second stretch with no reference build at all), while at 15s it played steadily
# start to finish in 286s of wall clock against its authored 232s. Exhaustively resolving the
# deepest holds takes far longer than any watchable number — that question belongs to
# `--livetest`, which can wait as long as it likes because nobody is watching it.
[playback]
pace = "settled"
settle_timeout = 15

[[location]]
id = "home"
re = "-0.5"
im = "0.0"
zoom = 1.33333

[[location]]
id = "minibrot"
re = "-7.436438870371587047521915061147723443299582954590750709038e-1"
im = "1.318259042053119704931320563851357020465533657480713907209e-1"
note = "Period-16014 island in Seahorse Valley (found with --find-minibrot)."

[[segment]]
id = "overview"
title = "The whole set"
t = 0

[[segment]]
id = "dive"
title = "Dive to the minibrot"
t = 10

# --- overview (hold on the whole set) ---
[[keyframe]]
id = "open"
t = 0
location = "home"
palette = "Ember"
max_iter = 2000
hold = 3.5

# --- glide into Seahorse Valley, pause to look ---
[[keyframe]]
id = "seahorse"
t = 7
location = "minibrot"
zoom = 73.3333
max_iter = 3000
hold = 3

# --- the dive: accelerate in, cruise at constant zoom rate, decelerate onto the minibrot ---
[[keyframe]]
id = "dive-1"
t = 15
zoom = 66666.7
max_iter = 8000
ease = "in"
[[keyframe]]
id = "dive-2"
t = 21
zoom = "1.33333e10"
max_iter = 25000
ease = "linear"
[[keyframe]]
id = "dive-3"
t = 27
zoom = "1.33333e17"
max_iter = 45000
ease = "linear"
[[keyframe]]
id = "dive-4"
t = 33
zoom = "1.33333e24"
max_iter = 70000
ease = "linear"
[[keyframe]]
id = "arrive"
t = 39
zoom = "8e29"
max_iter = 100000
ease = "out"
hold = 5

# --- narration ---
[[annotation]]
kind = "caption"
text = "The Mandelbrot Set"
t = 0.2
secs = 3.2
pos = "center"
size = 34
[[annotation]]
kind = "caption"
text = "Endless detail hides at every scale"
t = 0.6
secs = 2.9
[[annotation]]
kind = "caption"
text = "Seahorse Valley"
t = 7.0
secs = 2.9
pos = "top"
size = 28
[[annotation]]
kind = "caption"
text = "Diving deeper — past one million million million times"
t = 11.5
secs = 6.0
[[annotation]]
kind = "caption"
text = "10^30x — a minibrot: a tiny copy of the whole set"
t = 29.4
secs = 4.5
size = 26

# --- overview callouts (point out landmarks while we hold on the set) ---
[[annotation]]
kind = "callout"
text = "period-2 bulb"
re = "-1.0"
im = "0.0"
t = 1.0
secs = 2.6
[[annotation]]
kind = "callout"
text = "Seahorse Valley"
re = "-0.75"
im = "0.11"
t = 1.0
secs = 2.6
[[annotation]]
kind = "callout"
text = "Elephant Valley"
re = "0.30"
im = "0.0"
t = 1.0
secs = 2.6
[[annotation]]
kind = "callout"
text = "a minibrot in the antenna"
re = "-1.75"
im = "0.0"
t = 1.0
secs = 2.6

# --- spotlight the minibrot at the finale ---
[[annotation]]
kind = "spotlight"
location = "minibrot"
radius = 0.28
softness = 0.1
dim = 0.7
t = 30.0
secs = 4.0
fade = 0.8
