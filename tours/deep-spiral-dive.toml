# Fractadyne guided tour: overview of the Mandelbrot set, its landmark features,
# then a slow, relaxing ~10^420x dive into Elephant Valley ending on an endless,
# self-similar spiral (a Misiurewicz spiral - infinite detail all the way down).
# Paced gently (~4 orders of magnitude per second) - best rendered to a movie.
#
#   Play in-app:  Tools -> Play script...
#   Render movie: fractadyne --render-tour tours/deep-spiral-dive.toml --out frames --mp4
format_version = 2
name = "Deep dive to an infinite spiral"

[render]
size = "1920x1080"
fps = 30
ss = 2

# Live playback (Tools -> Play script) only. The live view raises its iteration budget over
# successive SETTLED frames, which at these depths needs longer than a hold of wall clock —
# without this the tour walks past its own destination while the screen is still black.
# An offline render is unaffected: it always computes every frame to completion.
[playback]
pace = "settled"
# 20s (the default) is not enough at these depths: every raise of the iteration budget triggers a
# fresh reference build, ~10s a piece past 1e60x, and the budget needs several raises to climb
# from the depth-scaled cap to what the field wants. Measured at 1e61x: the default expired with
# the view at 146k of the 400k this keyframe asks for, still 42% black.
settle_timeout = 90

[[location]]
id = "home"
re = "-0.5"
im = "0.0"
zoom = 1.33333

[[location]]
id = "spiral"
re = "2.-1"
im = "1.-2"
note = "Misiurewicz spiral in Elephant Valley - self-similar past 10^420x."

[[segment]]
id = "overview"
title = "The whole set"
t = 0

[[segment]]
id = "descent"
title = "The descent to 10^420x"
t = 18.5

[[keyframe]]      # overview - rest on the whole set
id = "open"
t = 0
location = "home"
palette = "Ember"
max_iter = 2000
hold = 4.5

[[keyframe]]      # PAN across at full-set zoom to the Elephant Valley target. Panning at zoom 1
                  # (whole set in frame) keeps the composition on the boundary the whole way; a
                  # simultaneous pan+zoom here would zoom into the cardioid's black interior.
id = "pan-to-target"
t = 9.5
location = "spiral"
zoom = 1.33333
ease = "smoother"
hold = 1.0

[[keyframe]]      # now that we are framed on the boundary, zoom down into Elephant Valley
id = "elephant"
t = 15.5
zoom = 53.3333
max_iter = 3000
ease = "in"
hold = 3.0

[[keyframe]]      # ease into the dive...
id = "dive-e6"
t = 26.5
zoom = "1.33333e6"
max_iter = 20000
ease = "in"
[[keyframe]]      # ...then cruise at a slow, constant zoom rate...
id = "dive-e100"
t = 50.5
zoom = "1.33333e100"
max_iter = 150000
ease = "linear"
[[keyframe]]
id = "dive-e200"
t = 74.5
zoom = "1.33333e200"
max_iter = 300000
ease = "linear"
[[keyframe]]
id = "dive-e300"
t = 98.5
zoom = "1.33333e300"
max_iter = 450000
ease = "linear"
[[keyframe]]      # ...and settle softly onto the spiral
id = "arrive"
t = 128.5
zoom = "1.33333e420"
max_iter = 700000
ease = "out"
hold = 7

[[annotation]]
kind = "caption"
text = "The Mandelbrot Set"
t = 0.3
secs = 3.6
pos = "center"
size = 34
[[annotation]]
kind = "caption"
text = "Endless detail hides at every scale"
t = 0.9
secs = 3.2
[[annotation]]
kind = "caption"
text = "Elephant Valley"
t = 12.0
secs = 3.5
pos = "top"
size = 28
[[annotation]]
kind = "caption"
text = "Diving in - a hundred, a thousand, a million-fold and beyond..."
t = 18.5
secs = 9.0
[[annotation]]
kind = "caption"
text = "...far past the scale of an atom, and still self-similar"
t = 52.0
secs = 12.0
[[annotation]]
kind = "caption"
text = "The same forms return, scale after scale"
t = 90.0
secs = 11.0
[[annotation]]
kind = "caption"
text = "10^420x deep - an endless spiral"
t = 124.5
secs = 6.5
size = 26

[[annotation]]
kind = "callout"
text = "period-2 bulb"
re = "-1.0"
im = "0.0"
t = 1.2
secs = 3.0
[[annotation]]
kind = "callout"
text = "Seahorse Valley"
re = "-0.75"
im = "0.11"
t = 1.2
secs = 3.0
[[annotation]]
kind = "callout"
text = "Elephant Valley"
re = "0.30"
im = "0.0"
t = 1.2
secs = 3.0
[[annotation]]
