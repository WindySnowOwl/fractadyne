# Fractadyne guided tour: overview of the Mandelbrot set, its landmark features,
# then a slow, relaxing ~10^420x dive into Elephant Valley ending on an endless,
# self-similar spiral (a Misiurewicz spiral — infinite detail all the way down).
# Paced gently (~4 orders of magnitude per second) — best rendered to a movie.
#
#   Play in-app:  Tools -> Play script...
#   Render movie: fractadyne --render-tour tours/deep-spiral-dive.toml \
#                   --fps 30 --size 1920x1080 --ss 2 --out frames --mp4
name = "Deep dive to an infinite spiral"
format_version = 1
palette = "Ember"

[[keyframe]]      # overview — rest on the whole set
secs = 0
center_x = "-0.5"
center_y = "0.0"
mag = 1
hold = 4.5

[[keyframe]]      # PAN across at full-set zoom to the Elephant Valley target. Panning at mag 1
                  # (whole set in frame) keeps the composition on the boundary the whole way; a
                  # simultaneous pan+zoom here would zoom straight into the cardioid's black interior.
secs = 5
center_x = "2.-1"
center_y = "1.-2"
mag = 1
ease = "smoother"
hold = 1.0

[[keyframe]]      # now that we're framed on the boundary, zoom down into Elephant Valley
secs = 5
mag = 40
ease = "in"
hold = 3.0

[[keyframe]]      # ease into the dive...
secs = 8
mag = 1e6
ease = "in"
[[keyframe]]      # ...then cruise at a slow, constant zoom rate (mag_log10 for depths past f64 range)...
secs = 24
mag_log10 = 100
ease = "linear"
[[keyframe]]
secs = 24
mag_log10 = 200
ease = "linear"
[[keyframe]]
secs = 24
mag_log10 = 300
ease = "linear"
[[keyframe]]      # ...and settle softly onto the spiral
secs = 30
mag_log10 = 420
ease = "out"
hold = 7

[[caption]]
text = "The Mandelbrot Set"
at = 0.3
secs = 3.6
pos = "center"
size = 34
[[caption]]
text = "Endless detail hides at every scale"
at = 0.9
secs = 3.2
pos = "bottom"
[[caption]]
text = "Elephant Valley"
at = 12.0
secs = 3.5
pos = "top"
size = 28
[[caption]]
text = "Diving in — a hundred, a thousand, a million-fold and beyond..."
at = 18.5
secs = 9.0
pos = "bottom"
[[caption]]
text = "...far past the scale of an atom, and still self-similar"
at = 52.0
secs = 12.0
pos = "bottom"
[[caption]]
text = "The same forms return, scale after scale"
at = 90.0
secs = 11.0
pos = "bottom"
[[caption]]
text = "10^420x deep — an endless spiral"
at = 124.5
secs = 6.5
pos = "bottom"
size = 26

[[callout]]
text = "period-2 bulb"
center_x = "-1.0"
center_y = "0.0"
at = 1.2
secs = 3.0
[[callout]]
text = "Seahorse Valley"
center_x = "-0.75"
center_y = "0.11"
at = 1.2
secs = 3.0
[[callout]]
text = "Elephant Valley"
center_x = "0.30"
center_y = "0.0"
at = 1.2
secs = 3.0
[[callout]]
text = "a minibrot in the antenna"
center_x = "-1.75"
center_y = "0.0"
at = 1.2
secs = 3.0

[[spotlight]]
center_x = "2.-1"
center_y = "1.-2"
radius = 0.3
softness = 0.12
dim = 0.6
at = 124.5
secs = 6.5
fade = 1.5
