# Fractadyne guided tour: overview of the Mandelbrot set, its landmark features,
# then a smooth ~10^420x dive into Elephant Valley ending on an endless,
# self-similar spiral (a Misiurewicz spiral — infinite detail all the way down).
#
#   Play in-app:  Tools -> Play script...
#   Render movie: fractadyne --render-tour tours/deep-spiral-dive.toml #                   --fps 30 --size 1920x1080 --ss 2 --out frames
name = "Deep dive to an infinite spiral"
format_version = 1
palette = "Ember"

[[keyframe]]      # overview — hold on the whole set
secs = 0
center_x = "-0.5"
center_y = "0.0"
mag = 1
hold = 3.5

[[keyframe]]      # glide into Elephant Valley, pause to look
secs = 3.5
center_x = "2.-1"
center_y = "1.-2"
mag = 40
ease = "smooth"
hold = 2.5

[[keyframe]]      # the dive: accelerate in...
secs = 5
mag = 1e6
ease = "in"
[[keyframe]]      # ...cruise at a constant zoom rate (mag_log10 for depths past f64 range)...
secs = 14
mag_log10 = 100
ease = "linear"
[[keyframe]]
secs = 14
mag_log10 = 200
ease = "linear"
[[keyframe]]
secs = 14
mag_log10 = 300
ease = "linear"
[[keyframe]]      # ...decelerate onto the spiral
secs = 16
mag_log10 = 420
ease = "out"
hold = 5

[[caption]]
text = "The Mandelbrot Set"
at = 0.2
secs = 3.2
pos = "center"
size = 34
[[caption]]
text = "Endless detail hides at every scale"
at = 0.6
secs = 2.9
pos = "bottom"
[[caption]]
text = "Elephant Valley"
at = 7.0
secs = 2.9
pos = "top"
size = 28
[[caption]]
text = "Diving in — a hundred, a thousand, a million-fold and beyond..."
at = 11.5
secs = 7.0
pos = "bottom"
[[caption]]
text = "...far past the scale of an atom, and still self-similar"
at = 26.0
secs = 8.0
pos = "bottom"
[[caption]]
text = "10^420x deep — an endless spiral"
at = 51.0
secs = 4.5
pos = "bottom"
size = 26

[[callout]]
text = "period-2 bulb"
center_x = "-1.0"
center_y = "0.0"
at = 1.0
secs = 2.6
[[callout]]
text = "Seahorse Valley"
center_x = "-0.75"
center_y = "0.11"
at = 1.0
secs = 2.6
[[callout]]
text = "Elephant Valley"
center_x = "0.30"
center_y = "0.0"
at = 1.0
secs = 2.6
[[callout]]
text = "a minibrot in the antenna"
center_x = "-1.75"
center_y = "0.0"
at = 1.0
secs = 2.6

[[spotlight]]
center_x = "2.-1"
center_y = "1.-2"
radius = 0.3
softness = 0.12
dim = 0.6
at = 51.0
secs = 4.0
fade = 1.0
