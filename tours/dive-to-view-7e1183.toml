# Fractadyne tour — generated by "Script to current view".
# Zooms from the full view to a saved location. Play: Tools → Play script;
# render: fractadyne --render-tour <this file> --size 1920x1080 --mp4.
name = "Dive to view"
format_version = 1

[[keyframe]]            # full view
fractal = "Mandelbrot"
center_re = "-0.5"
center_im = "0"
mag = 1.0
secs = 0.0
hold = 1.0

[[keyframe]]            # recenter onto the target (still zoomed out)
center_re = "-1.-1"
center_im = "9.-1"
mag = 8.0
secs = 4
ease = "smooth"
hold = 0.5

[[keyframe]]            # dive in (center fixed — inherited from above)
mag_log10 = 1183.855901
secs = 1784
ease = "out"        # decelerate onto the point
hold = 2.0

[[caption]]
text = "Diving to filament end at  6.2e1183 zoom"
at = 0.0
secs = 1792
pos = "bottom"
