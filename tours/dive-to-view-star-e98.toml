# Fractadyne tour — generated by "Script to current view".
# Zooms from the full view to a saved location. Play: Tools → Play script;
# render: fractadyne --render-tour <this file> --out frames --mp4.
format_version = 2
name = "Dive to view"

[render]
size = "1920x1080"
fps = 30

[[location]]
id = "target"
re = "-5.62202621523037212744969596262961926232336058642000859332104071064648040651980117009368022864076665266819518615342205563126413961786451e-1"
im = "6.42817149072775248899624656627830941472997397665282056405495715932366418738755172614822993656471501541311398325174287701850021449311247e-1"

[[keyframe]]            # full view
id = "home"
t = 0.0
fractal = "Mandelbrot"
re = "-0.5"
im = "0"
zoom = 1.0
max_iter = 2000
hold = 1.5

[[keyframe]]            # recenter onto the target (still zoomed out)
id = "recenter"
t = 5.5
location = "target"
zoom = 8.0
max_iter = 3000
ease = "smooth"
hold = 0.5

[[keyframe]]            # dive in (center fixed — inherited from above)
id = "dive"
t = 162
zoom = "4.703688924128391e99"
max_iter = 2000000
ease = "out"        # decelerate onto the point
hold = 2.0

[[annotation]]
kind = "caption"
text = "zoom to star e98"
t = 0.0
secs = 164.0
